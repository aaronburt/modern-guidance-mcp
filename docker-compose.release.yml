services:
  mwg-mcp:
    image: ghcr.io/aaronburt/modern-guidance-mcp:latest
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_OPTIONS=--max-old-space-size=400
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 350M
    restart: on-failure
